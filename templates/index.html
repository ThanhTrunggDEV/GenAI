<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hmong Pattern AI - Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'], },
                    colors: { brand: { 50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0d9488', 900: '#134e4a', } },
                    animation: { 'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite', 'float': 'float 6s ease-in-out infinite' },
                    keyframes: { float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } } }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f8fafc;
        }
        .main-container {
            min-height: calc(100vh - 4rem);
        }
        .sidebar-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }
        .canvas-area {
            background-color: #fdfdfd;
            background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
            background-size: 32px 32px;
            border: 1px solid #e2e8f0;
            box-shadow: inset 0 2px 20px rgba(0,0,0,0.02);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-brand-500 selection:text-white overflow-x-hidden p-4 sm:p-8">
    
    <div class="max-w-[1500px] mx-auto main-container flex flex-col lg:flex-row gap-8 items-stretch">
        
        <!-- LEFT COLUMN: Dashboard Sidebar -->
        <div class="w-full lg:w-[420px] flex-shrink-0 flex flex-col">
            <div class="sidebar-card rounded-[2rem] p-8 flex flex-col h-full relative overflow-hidden">
                
                <!-- Gentle Glow top left -->
                <div class="absolute -top-10 -left-10 w-40 h-40 bg-teal-50 rounded-full blur-3xl pointer-events-none"></div>

                <!-- Header inside Sidebar -->
                <div class="mb-8 relative z-10">
                    <div class="flex items-center gap-3 mb-2">
                        <div class="w-10 h-10 bg-gradient-to-br from-teal-500 to-blue-600 rounded-xl flex items-center justify-center shadow-lg">
                            <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path></svg>
                        </div>
                        <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">
                            Hmong<span class="text-brand-600">AI</span>
                        </h1>
                    </div>
                    <p class="text-sm text-slate-500 font-medium">
                        Generate culturally-authentic Hmong textile patterns
                    </p>
                </div>

                <hr class="border-slate-100 mb-8">

                <!-- Form -->
                <form id="generateForm" class="relative z-10 flex flex-col flex-1">
                    <div class="mb-6">
                        <label for="prompt" class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Pattern Description</label>
                        <textarea id="prompt" rows="4" 
                            class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl focus:bg-white focus:ring-4 focus:ring-brand-500/20 focus:border-brand-500 block p-4 custom-scrollbar transition-all duration-200 outline-none resize-none" 
                            placeholder="E.g., Intricate cross-stitch Hmong flower motif on indigo cloth..."></textarea>
                    </div>

                    <div class="mb-8">
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Suggestions</label>
                        <div class="flex flex-col gap-2">
                            <button type="button" class="cursor-pointer sample-prompt text-left px-4 py-2.5 rounded-lg text-sm bg-white border border-slate-100 shadow-sm hover:border-brand-300 hover:text-brand-600 transition-all text-slate-600">
                                Traditional Hmong spiral pattern with geometric borders in red and black
                            </button>
                            <button type="button" class="cursor-pointer sample-prompt text-left px-4 py-2.5 rounded-lg text-sm bg-white border border-slate-100 shadow-sm hover:border-brand-300 hover:text-brand-600 transition-all text-slate-600">
                                Intricate cross-stitch Hmong flower motif on indigo cloth
                            </button>
                            <button type="button" class="cursor-pointer sample-prompt text-left px-4 py-2.5 rounded-lg text-sm bg-white border border-slate-100 shadow-sm hover:border-brand-300 hover:text-brand-600 transition-all text-slate-600">
                                Abstract geometric Hmong symbols representing mountains and farming
                            </button>
                        </div>
                    </div>

                    <div class="mt-auto space-y-5">
                        <div>
                            <label for="numSamples" class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Results to Generate</label>
                            <select id="numSamples" class="bg-slate-50 border border-slate-200 text-slate-700 font-semibold rounded-xl focus:bg-white focus:ring-4 focus:ring-brand-500/20 focus:border-brand-500 block w-full p-3.5 outline-none transition-all duration-200 cursor-pointer">
                                <option value="1">1 Image</option>
                                <option value="2">2 Images</option>
                                <option value="4" selected>4 Images (Grid)</option>
                            </select>
                        </div>
                        
                        <button type="submit" id="generateBtn" class="w-full bg-slate-900 border border-slate-800 hover:bg-brand-600 hover:border-brand-600 shadow-lg hover:shadow-brand-500/30 text-white font-bold rounded-xl text-base px-5 py-4 focus:ring-4 focus:ring-slate-900/30 transition-all duration-300 flex items-center justify-center gap-2 group">
                            <svg class="w-5 h-5 group-hover:rotate-12 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            <span>Generate Patterns</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- RIGHT COLUMN: Output Canvas Area -->
        <div class="flex-1 canvas-area rounded-[2rem] flex flex-col relative overflow-hidden" id="outputArea">
            
            <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center text-center p-8 animate-float pointer-events-none z-10">
                <div class="bg-white/80 p-5 rounded-3xl shadow-sm border border-slate-100 mb-6 backdrop-blur-md">
                    <svg class="w-12 h-12 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <h3 class="text-2xl font-bold text-slate-700 mb-2">Canvas is empty</h3>
                <p class="text-base text-slate-500 max-w-sm">Describe your desired pattern on the left, and visually stunning Hmong textiles will appear here.</p>
            </div>

            <!-- Loading State -->
            <div id="loading" class="hidden absolute inset-0 flex-col items-center justify-center text-center p-8 z-10">
                <div class="relative w-24 h-24 mb-6">
                    <div class="absolute inset-0 border-4 border-slate-100 rounded-full"></div>
                    <div class="absolute inset-0 border-4 border-brand-500 rounded-full border-t-transparent animate-spin"></div>
                </div>
                <h3 class="text-xl font-bold text-slate-800 mb-2">Generating artwork</h3>
                <p class="text-slate-500 text-sm bg-white border border-slate-200 px-4 py-1.5 rounded-full animate-pulse">Processing AI Model...</p>
            </div>

            <!-- Results area -->
            <div id="results" class="w-full h-full border-none p-6 md:p-12 overflow-y-auto custom-scrollbar relative z-20">
                <!-- Flex container aligns content to center -->
                <div id="gridContainer" class="w-full min-h-full flex items-center justify-center">
                </div>
            </div>
        </div>

    </div>

    <script>
        document.querySelectorAll('.sample-prompt').forEach(button => {
            button.addEventListener('click', function() {
                const textarea = document.getElementById('prompt');
                textarea.value = this.innerText.trim();
                textarea.focus();
                
                // Add visual feedback
                textarea.classList.add('ring-4', 'ring-brand-500/30', 'border-brand-500', 'bg-white');
                setTimeout(() => textarea.classList.remove('ring-4', 'ring-brand-500/30', 'border-brand-500', 'bg-white'), 400);
                
                // Automatically click generate for better UX
                setTimeout(() => {
                    document.getElementById('generateBtn').click();
                }, 100);
            });
        });

        document.getElementById('generateForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const prompt = document.getElementById('prompt').value;
            const numSamples = document.getElementById('numSamples').value;
            const btn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const gridContainer = document.getElementById('gridContainer');
            const emptyState = document.getElementById('emptyState');

            if (!prompt) {
                const p = document.getElementById('prompt');
                p.classList.add('ring-4', 'ring-red-500/30', 'border-red-500', 'bg-red-50');
                setTimeout(() => p.classList.remove('ring-4', 'ring-red-500/30', 'border-red-500', 'bg-red-50'), 1000);
                return;
            }

            btn.disabled = true;
            btn.classList.add('opacity-70', 'cursor-not-allowed', 'bg-slate-700');
            btn.innerHTML = '<svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> <span>Processing...</span>';
            
            emptyState.style.display = 'none';
            loading.classList.remove('hidden');
            loading.classList.add('flex');
            gridContainer.innerHTML = '';

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt, num_samples: parseInt(numSamples) })
                });

                const data = await response.json();
                
                if (data.success) {
                    let gridClass = 'grid gap-6 w-full max-w-4xl mx-auto ';
                    if (numSamples == 1) gridClass += 'grid-cols-1 max-w-2xl';
                    else if (numSamples == 2) gridClass += 'grid-cols-1 md:grid-cols-2';
                    else gridClass += 'grid-cols-1 md:grid-cols-2';

                    const wrapper = document.createElement('div');
                    wrapper.className = gridClass;

                    data.images.forEach((imgUrl, index) => {
                        const div = document.createElement('div');
                        div.className = 'bg-white p-2 rounded-2xl shadow-xl border border-slate-200 opacity-0 group hover:shadow-[0_15px_40px_-10px_rgba(0,0,0,0.15)] transition-all duration-300 hover:-translate-y-1';
                        div.style.animation = 'fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) ' + (index * 0.1) + 's forwards';
                        
                        div.innerHTML = '<a href="' + imgUrl + '" target="_blank" class="block relative rounded-xl overflow-hidden aspect-square">' +
    '<img src="' + imgUrl + '" class="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-500 ease-out bg-slate-100" alt="Generated Pattern">' +
    '<div class="absolute inset-0 bg-slate-900/0 group-hover:bg-slate-900/30 transition-colors duration-300 flex flex-col items-center justify-center">' +
    '<span class="text-white font-bold bg-slate-900/60 backdrop-blur-md px-6 py-3 rounded-full opacity-0 group-hover:opacity-100 transform translate-y-4 group-hover:translate-y-0 transition-all duration-300 shadow-xl">' +
    'View Full Size</span></div></a>';
                        wrapper.appendChild(div);
                    });
                    
                    gridContainer.appendChild(wrapper);

                    if (!document.getElementById('animStyles')) {
                        const style = document.createElement('style');
                        style.id = 'animStyles';
                        style.innerHTML = '@keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }';
                        document.head.appendChild(style);
                    }
                } else {
                    alert('Error: ' + data.error);
                    emptyState.style.display = 'flex';
                }
            } catch (err) {
                console.error(err);
                alert('An error occurred during generation.');
                emptyState.style.display = 'flex';
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-70', 'cursor-not-allowed', 'bg-slate-700');
                btn.innerHTML = '<svg class="w-5 h-5 group-hover:rotate-12 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> <span>Generate Patterns</span>';
                loading.classList.remove('flex');
                loading.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
